<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Sabor Restaurante</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="contenedor">

    <header>

        <a class="regresar" href="login.html">←</a>

        <button type="button" id="daltonismo">
            👁️ Daltonismo
        </button>

    </header>

    <div class="logo">
        <img src="../imagenes/WhatsApp Image 2026-07-02 at 10.55.32 PM.jpeg" alt="Logo" width="120">
    </div>

    <h1>Crea tu cuenta</h1>

    <p>
        Únete a Sabor Restaurante y disfruta de beneficios exclusivos.
    </p>

    <form action="../php/registro.php" method="POST">

        <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono" maxlength="10" required>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="button" id="verPassword">
                Mostrar
            </button>
        </div>

        <div class="campo">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar" required>

            <button type="button" id="verConfirmar">
                Mostrar
            </button>
        </div>

        <button type="submit" class="boton">
            Crear cuenta
        </button>

    </form>

    <div class="login">
        ¿Ya tienes cuenta?
        <a href="../html/login.html">
            Iniciar sesión
        </a>
    </div>

    <div class="imagen">
        <img src="../imagenes/WhatsApp Image 2026-07-22 at 9.39.20 PM.jpeg" alt="Restaurante" width="180">
    </div>

</div>

<script src="../js/script.js"></script>

</body>
</html>
